<!DOCTYPE html>
<html>

<head>
    <title>Community Map Maker</title>
    <meta charset="utf-8" />
    <meta name="description" content="OpenStreetMapを使ったコミュニティマップ作成ツール" />
    <meta property="og:description" content="OpenStreetMapを使ったコミュニティマップ作成ツール" />
    <meta property="og:url" content="https://k-sakanoshita.github.io/community_mapmaker/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Community Map Maker" />
    <meta property="og:image" content="https://k-sakanoshita.github.io/community_mapmaker/image/cMapmaker.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Community Map Maker" />
    <meta name="twitter:description" content="OpenStreetMapを使ったコミュニティマップ作成ツール" />
    <meta name="twitter:image" content="https://k-sakanoshita.github.io/community_mapmaker/image/cMapmaker.png" />

    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="preload" as="image" href="./image/cMapmaker.png?ver=20260823-54" />
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.jp" crossorigin />
    <link rel="stylesheet" href="system.css?ver=20260823-35" />
    <style>
        #startupStatus {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #fff7cb;
            color: #263238;
            font-family: Tahoma, sans-serif;
            text-align: center;
        }

        #startupStatus[hidden] {
            display: none;
        }

        .startup-status-card {
            box-sizing: border-box;
            width: min(420px, calc(100vw - 48px));
            max-height: calc(100vh - 48px);
            max-height: calc(100dvh - 48px);
            padding: 12px 12px 20px;
            overflow: auto;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16);
        }

        .startup-splash-image {
            display: block;
            width: auto;
            max-width: 100%;
            max-height: calc(100vh - 180px);
            max-height: calc(100dvh - 180px);
            height: auto;
            margin: 0 auto 16px;
            object-fit: contain;
            border-radius: 8px;
        }

        .startup-status-spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto 14px;
            border: 4px solid #c8ddd1;
            border-top-color: #00753a;
            border-radius: 50%;
            animation: startup-spin 0.8s linear infinite;
        }

        #startupStatus[data-error="true"] .startup-status-spinner {
            display: none;
        }

        #startupRetry {
            display: none;
            margin: 16px auto 0;
            padding: 8px 18px;
            border: 1px solid #00753a;
            border-radius: 6px;
            background: #fff;
            color: #00753a;
            font: inherit;
            cursor: pointer;
        }

        #startupStatus[data-error="true"] #startupRetry {
            display: block;
        }

        @keyframes startup-spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script type="module" src="./loader.module.js?ver=20260824-113"></script>
</head>

<body>
    <div id="startupStatus" role="status" aria-live="polite">
        <div class="startup-status-card">
            <img class="startup-splash-image" src="./image/cMapmaker.png?ver=20260823-54"
                alt="Community Map Maker" />
            <div class="startup-status-spinner" aria-hidden="true"></div>
            <strong id="startupStatusMessage">アプリを読み込んでいます…</strong>
            <button id="startupRetry" type="button" onclick="location.reload()">再読み込み</button>
        </div>
    </div>
    <div class="container-fluid m-0 p-0">
        <article id="article" class="two-pane d-none" style="display: none">
            <main id="top-pane">
                <div id="mapid"><canvas id="snow"></canvas></div>
            </main>
            <aside id="bottom-pane" class="row m-0">
                <div id="sidebarResizeHandle" title="ドラッグしてサイズ変更" aria-label="ドラッグしてリストのサイズを変更"></div>
                <div id="btmHeader" class="accordion p-2 h-100">

                    <!-- Detail -->
                    <div id="detailMenu" class="accordion-item mb-2">

                        <h2 id="detailHeader" class="d-flex align-items-center m-0 p-2">
                            <div class="dropdown me-2">
                                <button class="btn btn-light border-secondary p-0" type="button" id="btnMenuButton"
                                    data-bs-toggle="dropdown" aria-expanded="false" style="width: 30px; height: 30px">
                                    <i class="fas fa-bars text-black"></i>
                                </button>

                                <div class="dropdown-menu" aria-labelledby="btnMenuButton" id="btnMenu"></div>
                            </div>

                            <span class="detailTitle d-flex align-items-center" id="btmWindow_title"></span>
                        </h2>

                        <div id="detailArea">
                            <div class="accordion-body p-0">
                                <div id="mini-map" class="d-none mx-auto"></div>
                                <div id="btmWindow_message" class="p-1"></div>
                            </div>
                        </div>

                    </div>

                    <!-- list -->
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="listHeader">
                            <div class="accordion-button p-2" type="button" data-bs-toggle="collapse"
                                data-bs-target="#listAccordion" aria-expanded="true" aria-controls="listAccordion">
                                <span class="detailTitle ms-1" id="listTitle"></span>
                            </div>
                        </h2>

                        <div id="listAccordion" class="accordion-collapse collapse show" aria-labelledby="listHeader">
                            <div class="accordion-body p-0">
                                <!-- リスト -->
                                <div class="col-12 p-0" id="listArea"></div>

                                <!-- プレイバック操作 -->
                                <div class="col-12 d-flex align-items-center" id="list_playback_control">
                                    <button class="btn btn-light float-left border-secondary ms-2 me-2"
                                        onclick="cMapMaker.playback(listTable.getFilterList());"><i id="list_playback"
                                            class="fas fa-play"></i></button>
                                    <input type="range" class="form-range me-2" id="list_speed" />
                                </div>

                                <!-- ダウンロード -->
                                <div class="col-12 text-center" id="list_download">
                                    <button class="btn btn-light btn-lg border-secondary w-50 m-2 p-1"
                                        onclick="cMapMaker.download()">
                                        <i class="fas fa-download"></i>
                                        <span glot-model="download"></span>
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div id="panelProgress" class="col-12 p-0 mb-2 progress progress-bar bg-success" style="width: 0%;">
                    </div>
                    <div class="footerSpace"></div>
                </div>

                <div id="sidebarCont" class="row fixed-bottom m-2 pe-none d-none">
                    <div class="col-7 p-0">
                        <div class="btn-group btn-group-lg pe-auto"></div>
                    </div>
                    <div class="col-5 p-0">
                        <div class="ms-auto btn-group btn-group-lg d-flex pe-auto">
                            <button id="sidebarMinimize" class="btn btn-light border-secondary p-1"
                                onclick="javascript: winCont.setSidebar('mini')">
                                <i class="fa-solid fa-window-minimize"></i>
                            </button>
                            <button id="sidebarChange" class="btn btn-light border-secondary p-1"
                                onclick="javascript: winCont.setSidebar('change')">
                                <i class="fa-solid fa-chevron-down"></i>
                            </button>
                            <button id="sidebarClose" class="btn btn-light border-secondary p-1"
                                onclick="javascript:cMapMaker.viewDetail();cMapMaker.changeMode('list')">
                                <i class="fa-regular fa-rectangle-xmark"></i>
                            </button>
                            <button id="closeDetail" class="btn btn-light border-secondary p-1"
                                onclick="javascript:cMapMaker.changeMode('list')">
                                <i class="fa-solid fa-check"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </aside>
        </article>
    </div>

    <div id="splashImage" class="modal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document" data-keyboard="false">
            <div class="modal-body">
                <img src="" style="width: 100%;float: none !important" id="splashSrc"><br>
                <div class="d-flex justify-content-center mt-2">
                    <div class="spinner-border text-primary mx-auto" role="status"> </div>
                </div>
            </div>
        </div>
    </div>

    <div id="PinchImageBK" onclick="modalActs.closeMedia()">
        <div class="d-flex align-items-center justify-content-center h-100">
            <div class="spinner-border text-primary" id="image_spinner"></div>
        </div>
    </div>
    <img id="PinchImage" draggable="false" onclick="modalActs.toggleImageSize(this, event)"></img>
    <button type="button" id="PinchImageClose" aria-label="画像を閉じる" title="閉じる" onclick="event.stopPropagation(); modalActs.closeMedia()">✕</button>
    <video id="FullScreenVideo" playsinline onclick="modalActs.toggleVideo(this)"></video>
    <button type="button" id="FullScreenVideoClose" aria-label="動画を閉じる" title="閉じる" onclick="event.stopPropagation(); modalActs.closeMedia()">✕</button>

    <div id="scrollHand" class="d-flex justify-content-center d-none">
        <img src="./image/hand-pointer-solid.svg" width="42px">
    </div>
</body>

</html>
